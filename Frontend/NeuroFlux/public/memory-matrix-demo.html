<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Matrix Demo - NeuroFlux</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .animate-fade-in { animation: fade-in 0.5s ease-out; }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 to-purple-900 min-h-screen flex items-center justify-center p-4">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    
    // Paste MemoryMatrix.jsx content here (imported as string for demo)
    function Button({ children, onClick, className = '', disabled = false }) {
      return (
        <button 
          onClick={onClick}
          disabled={disabled}
          className={`px-6 py-2 rounded-xl font-bold shadow-lg transition-all duration-300 transform ${className} ${
            disabled ? 'opacity-50 cursor-not-allowed' : 'hover:-translate-y-1 hover:shadow-xl active:scale-95'
          }`}
        >
          {children}
        </button>
      );
    }
    
    // MemoryMatrix component (copied from file)
    const MemoryMatrix = () => {
      const [gameData, setGameData] = useState(null);
      const [showPattern, setShowPattern] = useState(false);
      const [userGrid, setUserGrid] = useState(Array(16).fill(false));
      const [phase, setPhase] = useState('idle');
      const [result, setResult] = useState({ correct: false, accuracy: 0 });
      const [score, setScore] = useState(0);

      const GRID_SIZE = 4;
      const SHOW_TIME = 3000;

      const fetchGamePattern = () => {
        return new Promise((resolve) => {
          setTimeout(() => {
            const positions = [];
            const count = Math.floor(Math.random() * 3) + 2;
            while (positions.length < count) {
              const row = Math.floor(Math.random() * GRID_SIZE);
              const col = Math.floor(Math.random() * GRID_SIZE);
              if (!positions.some(p => p.row === row && p.col === col)) {
                positions.push({ row, col });
              }
            }
            resolve({
              id: Date.now(),
              size: GRID_SIZE,
              pattern: positions,
              showTime: SHOW_TIME
            });
          }, 500);
        });
      };

      const checkAccuracy = (guess, pattern) => {
        return guess.length === pattern.length && 
               guess.every((pos, i) => pos.row === pattern[i].row && pos.col === pattern[i].col);
      };

      const startGame = useCallback(async () => {
        const data = await fetchGamePattern();
        setGameData(data);
        setUserGrid(Array(16).fill(false));
        setPhase('showing');
        setShowPattern(true);
        
        setTimeout(() => {
          setShowPattern(false);
          setPhase('playing');
        }, data.showTime);
      }, []);

      const toggleCell = useCallback((index) => {
        if (phase !== 'playing') return;
        const newGrid = [...userGrid];
        newGrid[index] = !newGrid[index];
        setUserGrid(newGrid);
      }, [userGrid, phase]);

      const getUserGuess = useCallback(() => {
        return userGrid
          .map((lit, i) => lit ? { row: Math.floor(i / GRID_SIZE), col: i % GRID_SIZE } : null)
          .filter(Boolean);
      }, [userGrid]);

      const submitGuess = useCallback(() => {
        if (!gameData) return;
        const guess = getUserGuess();
        const correct = checkAccuracy(guess, gameData.pattern);
        const accuracy = Math.floor((guess.filter((pos, i) => 
          gameData.pattern.some(p => p.row === pos.row && p.col === pos.col)
        ).length / gameData.pattern.length) * 100);
        
        setResult({ correct, accuracy });
        setPhase('result');
        setScore(prev => prev + Math.floor(accuracy));
      }, [gameData, getUserGuess]);

      const resetGame = useCallback(() => {
        setPhase('idle');
        setGameData(null);
        setUserGrid(Array(16).fill(false));
        setResult({ correct: false, accuracy: 0 });
      }, []);

      const renderCell = (row, col, isLit = false, clickable = false) => {
        const index = row * GRID_SIZE + col;
        const userLit = userGrid[index];
        
        let className = 'w-20 h-20 border-2 border-gray-300 flex items-center justify-center text-xl font-bold transition-all duration-300 ease-in-out hover:border-blue-400 hover:shadow-lg rounded-lg';
        
        if (isLit || userLit) {
          className += ' bg-gradient-to-br from-blue-500 to-blue-700 text-white shadow-2xl animate-pulse';
        } else {
          className += ' bg-white hover:bg-gray-50';
        }
        
        if (phase === 'result') {
          if (isLit && !userLit) {
            className += ' animate-bounce border-red-500 bg-red-100/50';
          } else if (userLit && !isLit) {
            className += ' animate-pulse border-orange-500 bg-orange-100/50';
          }
        }
        
        if (clickable) {
          className += ' cursor-pointer active:scale-[0.95]';
        }

        return (
          <div
            key={`${row}-${col}`}
            className={className}
            onClick={() => toggleCell(index)}
          >
            {isLit ? '●' : ''}
          </div>
        );
      };

      return (
        <div className="max-w-lg mx-auto p-8 bg-gradient-to-b from-white/80 to-indigo-100/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/50">
          <h1 className="text-4xl font-black bg-gradient-to-r from-blue-600 via-purple-600 to-indigo-600 bg-clip-text text-transparent mb-8 text-center drop-shadow-lg">
            🧠 Memory Matrix
          </h1>
          
          <div className="mb-12">
            <div className="text-center mb-6">
              <div className="text-3xl font-black text-gray-800 mb-2 drop-shadow-md">
                Score: <span className="text-4xl text-green-600 drop-shadow-lg">{score}</span>
              </div>
              <div className={`mt-4 text-xl font-semibold px-4 py-2 rounded-full bg-white/50 backdrop-blur-sm shadow-lg transition-all duration-500 ${
                phase === 'result' 
                  ? result.correct ? 'bg-green-500/20 text-green-800 border-2 border-green-500 animate-bounce' : 'bg-red-500/20 text-red-800 border-2 border-red-500'
                  : 'bg-blue-500/20 text-blue-800 border-2 border-blue-500'
              }`}>
                {phase === 'showing' && '👀 Watch & Memorize!'}
                {phase === 'playing' && '🖱️ Click to recreate'}
                {phase === 'result' && `${result.correct ? '🎉 Perfect Match!' : `❌ ${result.accuracy}% Accuracy`}`}
              </div>
            </div>
          </div>

          <div className="grid grid-cols-4 gap-2 mb-12 mx-auto w-fit p-4 bg-white/50 rounded-2xl shadow-xl animate-fade-in">
            {Array.from({ length: GRID_SIZE }, (_, row) =>
              Array.from({ length: GRID_SIZE }, (_, col) => {
                const isPatternLit = showPattern && gameData?.pattern.some(p => p.row === row && p.col === col);
                const clickable = phase === 'playing';
                return renderCell(row, col, isPatternLit, clickable);
              })
            )}
          </div>

          <div className="flex flex-col sm:flex-row gap-4 justify-center items-center">
            {phase === 'idle' && (
              <Button 
                onClick={startGame}
                className="bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white px-12 py-4 text-xl shadow-2xl"
              >
                🚀 Start Memory Challenge
              </Button>
            )}
            
            {phase === 'playing' && (
              <Button 
                onClick={submitGuess}
                className="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white px-12 py-4 text-xl shadow-2xl"
                disabled={userGrid.every(v => !v)}
              >
                ✅ Check Answer
              </Button>
            )}
            
            {(phase === 'result' || phase === 'playing') && (
              <Button 
                onClick={resetGame}
                className="bg-gradient-to-r from-slate-500 to-gray-600 hover:from-slate-600 hover:to-gray-700 text-white px-12 py-4 text-xl shadow-2xl"
              >
                🔄 Play Again
              </Button>
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MemoryMatrix />);
  </script>
</body>
</html>

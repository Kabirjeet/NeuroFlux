<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const SAMPLE_DATA = {
      shuffledTerms: ['React', 'Node.js', 'Mongoose', 'Primary Key', 'Gemini'],
      shuffledDefinitions: [
        'JavaScript library for UI',
        'Server-side JS runtime',
        'MongoDB ODM',
        'Unique database identifier',
        'Google AI model'
      ],
      pairs: [
        {term: 'React', definition: 'JavaScript library for UI'},
        {term: 'Node.js', definition: 'Server-side JS runtime'},
        {term: 'Mongoose', definition: 'MongoDB ODM'},
        {term: 'Primary Key', definition: 'Unique database identifier'},
        {term: 'Gemini', definition: 'Google AI model'}
      ],
      numPairs: 5
    };

    // Paste ConceptClash.jsx content here
    const ConceptClash = // ... full component code above

    const App = () => {
      const [gameData, setGameData] = useState(null);
      const [feedback, setFeedback] = useState({});

      const handleSubmit = (userMatches) => {
        // Simulate backend validateMatch
        const results = userMatches.map(match => ({
          termIndex: match.termIndex,
          defIndex: match.defIndex,
          isCorrect: Math.random() > 0.3 // Simulate
        }));
        const correctCount = results.filter(r => r.isCorrect).length;
        setFeedback({
          show: true,
          score: Math.round((correctCount / userMatches.length) * 100),
          correctCount,
          total: userMatches.length,
          results
        });
        console.log('Submitted:', userMatches);
      };

      useEffect(() => {
        setGameData(SAMPLE_DATA);
      }, []);

      return (
        <div className="h-screen">
          <ConceptClash gameData={gameData} onSubmit={handleSubmit} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
